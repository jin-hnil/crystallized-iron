<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystallized Iron - Web Client</title>
</head>

<body>
  <div id="login-screen">
    <div class="login-box">
      <h1>CRYSTALLIZED IRON</h1>
      <p>Awakener Login</p>
      <input type="text" id="username-input" placeholder="Enter your name..." />
      <button id="join-btn">ENTER WORLD</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="game-ui" style="display: none;">
    <!-- HUD -->
    <div id="hud-top-left">
      <div class="player-info">
        <span id="hud-name">PlayerName</span> <span id="hud-level">Lv.1</span>
      </div>
      <div class="bar-container">
        <div id="hp-bar" class="bar hp">
          <div class="fill"></div>
        </div>
        <span class="bar-text">100/100 HP</span>
      </div>
      <div class="bar-container">
        <div id="mp-bar" class="bar mp">
          <div class="fill"></div>
        </div>
        <span class="bar-text">100/100 MP</span>
      </div>
    </div>

    <div id="hud-top-right">
      <div class="mini-map-placeholder">
        <span>Khu 1</span>
      </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Chat System -->
    <div id="chat-system">
      <div id="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type here..." />
        <button id="send-chat-btn">Send</button>
      </div>
    </div>

    <!-- Controls -->
    <div id="controls-hint">
      WASD/Arrows/Right-click to Move | Enter to Chat
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
